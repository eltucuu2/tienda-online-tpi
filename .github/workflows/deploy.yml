name: Build and Deploy to Azure App Service

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  # Usamos secretos para no exponer datos sensibles
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  # Nombre de tu imagen (manteniendo el mismo nombre)
  IMAGE_NAME: dsw2025tpi-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production # Esto activa las reglas de protección que configuraste
    
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 1.1 Restaurar dependencias
        run: dotnet restore

      - name: 1.2 Verificar formato de código
        run: dotnet format --verify-no-changes

      - name: 1.3 Ejecutar pruebas unitarias
        run: dotnet test --configuration Release --no-restore

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Construir la imagen Docker
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile \
            .

      - name: 4. Subir la imagen a Docker Hub
        # Solo subimos si NO es un pull request (evita subir basura en PRs)
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 5. Desplegar el contenedor en Azure App Service
        # Solo desplegamos si NO es un pull request
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
